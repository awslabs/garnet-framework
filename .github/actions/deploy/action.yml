name: Deploy Garnet
description: Assume a deployment role via OIDC, configure the stack, and deploy it

inputs:
  aws-role-arn:
    description: IAM role to assume via GitHub OIDC. No long-lived access keys.
    required: true
  aws-region:
    description: Region to deploy into
    required: true
  aws-account-id:
    description: Exact 12-digit AWS account expected for this environment
    required: true
  broker-image:
    description: Immutable Garnet Broker image reference
    required: true
  load-image:
    description: Optional immutable Garnet load-runner image
    required: false
    default: ''
  public-origin:
    description: Public broker origin for distributed callbacks
    required: false
    default: ''
  notification-origins:
    description: Additional exact notification callback origins
    required: false
    default: ''
  context-hosts:
    description: Approved remote JSON-LD Context hosts
    required: false
    default: ''
  eventual-entity-reads:
    description: Use the Aurora reader endpoint for eligible Entity reads
    required: false
    default: 'false'
  database-reader-enabled:
    description: Keep an Aurora reader as a warm failover target
    required: false
    default: 'true'
  aws-iot-core-mqtt-connector-enabled:
    description: Enable the tenant-bound Subscription to IoT Core MQTT connector
    required: false
    default: 'false'
  aurora-min-acu:
    description: Aurora Serverless v2 minimum capacity
    required: false
    default: '2'
  aurora-max-acu:
    description: Aurora Serverless v2 maximum capacity
    required: false
    default: '128'
  aurora-storage:
    description: standard or io-optimized
    required: false
    default: standard
  worker-spot-scale-out:
    description: Use EC2 Spot after each worker service's on-demand floor
    required: false
    default: 'true'
  ecs-instance-type:
    description: auto or an ARM64 Graviton EC2 instance type
    required: false
    default: auto
  deployment-strategy:
    description: rolling or bluegreen
    required: false
    default: bluegreen
  schema-compatibility:
    description: unchanged or backward-compatible; writer-drain releases are blocked
    required: true
  bootstrap-tenant:
    description: Tenant receiving the bootstrap administrator policy
    required: false
    default: default
  oidc-issuer:
    description: Exact external OpenID Connect issuer URL
    required: true
  oidc-audiences:
    description: Comma-separated OAuth audiences accepted by Garnet
    required: true
  oidc-tenant-claim:
    description: Optional token claim containing tenant grants
    required: false
    default: garnet_tenants
  bootstrap-admin-subject:
    description: Exact OIDC subject receiving TenantAdministrator
    required: true
  authorization-policies:
    description: Optional JSON array of custom policy documents
    required: false
    default: '[]'
  authorization-bindings:
    description: Optional JSON array of additional principal bindings
    required: false
    default: '[]'
  smoke-authorization:
    description: Short-lived Bearer credential for the post-deploy smoke test
    required: true
  nat-gateway-count:
    description: One for disposable tests or two for zone-independent egress
    required: false
    default: '2'
  database-deletion-protection:
    description: Protect the Aurora cluster from deletion
    required: false
    default: 'true'
  database-backup-retention-days:
    description: Aurora continuous-backup retention from 1 to 35 days
    required: false
    default: '35'
  temporal-history-retention-days:
    description: Maximum queryable Aurora Temporal history age
    required: false
    default: '365'
  temporal-history-retention-max-gib:
    description: Maximum Temporal history and typed-index footprint in GiB
    required: false
    default: '500'
  temporal-history-retention-max-partitions:
    description: Maximum expired daily or legacy monthly partitions truncated per run
    required: false
    default: '12'
  node-version:
    description: Node version used for the build
    required: false
    default: '24'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm

    - name: Install dependencies
      shell: bash
      run: |
        npm ci --ignore-scripts
        # The Lambda layer is bundled from disk by Code.fromAsset, so its
        # dependencies must be installed before synth or the layer ships empty.
        npm ci --prefix lib/layers/nodejs

    - name: Validate deployment identity
      shell: bash
      env:
        EXPECTED_AWS_ACCOUNT_ID: ${{ inputs.aws-account-id }}
      run: |
        if [[ ! "$EXPECTED_AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]; then
          echo "aws-account-id must be an exact 12-digit AWS account ID" >&2
          exit 1
        fi

    # Short-lived credentials minted per run. Nothing to rotate or leak.
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6.2.1
      with:
        role-to-assume: ${{ inputs.aws-role-arn }}
        aws-region: ${{ inputs.aws-region }}
        allowed-account-ids: ${{ inputs.aws-account-id }}
        role-session-name: garnet-deploy-${{ github.run_id }}

    - name: Select newest available Graviton generation
      shell: bash
      env:
        REQUESTED_INSTANCE_TYPE: ${{ inputs.ecs-instance-type }}
        AWS_REGION: ${{ inputs.aws-region }}
      run: |
        selected="$REQUESTED_INSTANCE_TYPE"
        if [[ "$selected" == "auto" ]]; then
          for candidate in c9g.2xlarge c8g.2xlarge c7g.2xlarge c6g.2xlarge; do
            count="$(aws ec2 describe-instance-type-offerings \
              --region "$AWS_REGION" \
              --location-type region \
              --filters "Name=instance-type,Values=$candidate" \
              --query 'length(InstanceTypeOfferings)' \
              --output text)"
            if [[ "$count" != "0" ]]; then
              selected="$candidate"
              break
            fi
          done
        fi
        if [[ "$selected" == "auto" ]]; then
          echo "No supported Graviton ECS instance type is offered in $AWS_REGION" >&2
          exit 1
        fi
        echo "GARNET_ECS_INSTANCE_TYPE=$selected" >> "$GITHUB_ENV"

    - name: Apply deployment configuration
      shell: bash
      env:
        GARNET_BROKER_IMAGE: ${{ inputs.broker-image }}
        GARNET_LOAD_IMAGE: ${{ inputs.load-image }}
        GARNET_BROKER_PUBLIC_ORIGIN: ${{ inputs.public-origin }}
        GARNET_NOTIFICATION_DELIVERY_ALLOW_ORIGINS: ${{ inputs.notification-origins }}
        GARNET_CONTEXT_ALLOW_HOSTS: ${{ inputs.context-hosts }}
        GARNET_EVENTUAL_ENTITY_READS: ${{ inputs.eventual-entity-reads }}
        GARNET_DATABASE_READER_ENABLED: ${{ inputs.database-reader-enabled }}
        GARNET_AWS_IOT_CORE_MQTT_CONNECTOR_ENABLED: ${{ inputs.aws-iot-core-mqtt-connector-enabled }}
        GARNET_AURORA_MIN_ACU: ${{ inputs.aurora-min-acu }}
        GARNET_AURORA_MAX_ACU: ${{ inputs.aurora-max-acu }}
        GARNET_AURORA_STORAGE: ${{ inputs.aurora-storage }}
        GARNET_WORKER_SPOT_SCALE_OUT: ${{ inputs.worker-spot-scale-out }}
        GARNET_DEPLOYMENT_STRATEGY: ${{ inputs.deployment-strategy }}
        GARNET_SCHEMA_COMPATIBILITY: ${{ inputs.schema-compatibility }}
        GARNET_BOOTSTRAP_TENANT: ${{ inputs.bootstrap-tenant }}
        GARNET_OIDC_ISSUER: ${{ inputs.oidc-issuer }}
        GARNET_OIDC_AUDIENCES: ${{ inputs.oidc-audiences }}
        GARNET_OIDC_TENANT_CLAIM: ${{ inputs.oidc-tenant-claim }}
        GARNET_BOOTSTRAP_ADMIN_SUBJECT: ${{ inputs.bootstrap-admin-subject }}
        GARNET_AUTHORIZATION_POLICIES: ${{ inputs.authorization-policies }}
        GARNET_AUTHORIZATION_BINDINGS: ${{ inputs.authorization-bindings }}
        GARNET_NAT_GATEWAY_COUNT: ${{ inputs.nat-gateway-count }}
        GARNET_DATABASE_DELETION_PROTECTION: ${{ inputs.database-deletion-protection }}
        GARNET_DATABASE_BACKUP_RETENTION_DAYS: ${{ inputs.database-backup-retention-days }}
        GARNET_TEMPORAL_HISTORY_RETENTION_DAYS: ${{ inputs.temporal-history-retention-days }}
        GARNET_TEMPORAL_HISTORY_RETENTION_MAX_GIB: ${{ inputs.temporal-history-retention-max-gib }}
        GARNET_TEMPORAL_HISTORY_RETENTION_MAX_PARTITIONS: ${{ inputs.temporal-history-retention-max-partitions }}
        GARNET_REGION: ${{ inputs.aws-region }}
      run: node .github/scripts/configure-garnet.js

    - name: Synthesize deployment assembly
      shell: bash
      run: npx cdk synth --quiet

    - name: Guard authorization configuration cutover
      shell: bash
      env:
        AWS_REGION: ${{ inputs.aws-region }}
      run: >-
        node .github/scripts/authorization-deployment-guard.js
        cdk.out/GarnetFramework.template.json
        GarnetFramework

    - name: Show what will change
      shell: bash
      # --fail is intentionally absent, so an ordinary diff exits zero while
      # credential, assembly and change-set failures still stop deployment.
      run: npx cdk diff --app cdk.out --method change-set

    - name: Deploy
      shell: bash
      run: |
        npx cdk deploy --app cdk.out \
          --require-approval never \
          --outputs-file cdk-outputs.json \
          --progress events
        # --require-approval never is safe here because the security-relevant
        # review already happened: CI gated the PR and the GitHub Environment
        # gated this job. An interactive prompt would just hang the runner.

    - name: Smoke test
      shell: bash
      env:
        AWS_REGION: ${{ inputs.aws-region }}
        SMOKE_AUTHORIZATION: ${{ inputs.smoke-authorization }}
      run: node .github/scripts/smoke-test.js

    - name: Publish stack outputs
      shell: bash
      run: |
        {
          echo "### Garnet deployment"
          echo ""
          echo "| Output | Value |"
          echo "| --- | --- |"
          node -e "
            const o = require('./cdk-outputs.json');
            const stack = o.GarnetFramework || {};
            const redact = k => /Token|Secret/i.test(k);
            for (const [k, v] of Object.entries(stack)) {
              console.log('| ' + k + ' | ' + (redact(k) ? '(redacted)' : String(v)) + ' |');
            }
          "
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload deployment outputs
      uses: actions/upload-artifact@v5
      with:
        name: cdk-outputs-${{ github.run_id }}
        path: cdk-outputs.json
        retention-days: 30
