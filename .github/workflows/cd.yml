name: CD

# Continuous delivery, not deployment: a merge to main deploys to dev
# automatically, then stage and prod each wait on a GitHub Environment approval.
# The broker is stateful and shares one Aurora cluster per environment, so a
# human decides when a release moves forward.
on:
  push:
    branches: [main, experimental]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        type: choice
        options: [dev, stage, prod]

# Serialize automatic promotion pipelines. Each deployment job also has an
# environment-specific group so manual and automatic runs cannot update the
# same stack concurrently. Never cancel an in-progress CDK deployment.
concurrency:
  group: cd-${{ github.event.inputs.environment || 'pipeline' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  # Re-verify rather than trusting that CI ran on this commit. Cheap, and it
  # closes the window where main is deployed without ever having been green.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --ci

  deploy-dev:
    name: Deploy dev
    needs: verify
    outputs:
      configured: ${{ steps.deployment-config.outputs.configured }}
    concurrency:
      group: garnet-deploy-dev
      cancel-in-progress: false
    # workflow_dispatch takes the single-environment path below instead
    if: github.event_name == 'push'
    # No approval on dev: it exists to find what unit tests cannot
    environment:
      name: dev
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required to mint the OIDC token
      contents: read
    steps:
      - name: Check automatic deployment configuration
        id: deployment-config
        shell: bash
        env:
          GARNET_AUTOMATIC_DEV_ENABLED: ${{ vars.GARNET_AUTOMATIC_DEV_ENABLED }}
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          GARNET_BROKER_IMAGE: ${{ vars.GARNET_BROKER_IMAGE }}
          GARNET_SCHEMA_COMPATIBILITY: ${{ vars.GARNET_SCHEMA_COMPATIBILITY }}
          GARNET_OIDC_ISSUER: ${{ vars.GARNET_OIDC_ISSUER }}
          GARNET_OIDC_AUDIENCES: ${{ vars.GARNET_OIDC_AUDIENCES }}
          GARNET_BOOTSTRAP_ADMIN_SUBJECT: ${{ vars.GARNET_BOOTSTRAP_ADMIN_SUBJECT }}
          GARNET_SMOKE_AUTHORIZATION: ${{ secrets.GARNET_SMOKE_AUTHORIZATION }}
        run: |
          missing=()
          [[ "$GARNET_AUTOMATIC_DEV_ENABLED" == "true" ]] || missing+=("GARNET_AUTOMATIC_DEV_ENABLED=true")
          [[ -n "$AWS_DEPLOY_ROLE_ARN" ]] || missing+=("AWS_DEPLOY_ROLE_ARN")
          [[ -n "$AWS_REGION" ]] || missing+=("AWS_REGION")
          [[ -n "$AWS_ACCOUNT_ID" ]] || missing+=("AWS_ACCOUNT_ID")
          [[ -n "$GARNET_BROKER_IMAGE" ]] || missing+=("GARNET_BROKER_IMAGE")
          [[ -n "$GARNET_SCHEMA_COMPATIBILITY" ]] || missing+=("GARNET_SCHEMA_COMPATIBILITY")
          [[ -n "$GARNET_OIDC_ISSUER" ]] || missing+=("GARNET_OIDC_ISSUER")
          [[ -n "$GARNET_OIDC_AUDIENCES" ]] || missing+=("GARNET_OIDC_AUDIENCES")
          [[ -n "$GARNET_BOOTSTRAP_ADMIN_SUBJECT" ]] || missing+=("GARNET_BOOTSTRAP_ADMIN_SUBJECT")
          [[ -n "$GARNET_SMOKE_AUTHORIZATION" ]] || missing+=("GARNET_SMOKE_AUTHORIZATION")
          if (( ${#missing[@]} > 0 )); then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping automatic dev deployment; configure: ${missing[*]}"
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        if: steps.deployment-config.outputs.configured == 'true'

      - uses: ./.github/actions/deploy
        if: steps.deployment-config.outputs.configured == 'true'
        # Repo/environment configuration, not secrets in the code
        with:
          aws-role-arn: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          aws-account-id: ${{ vars.AWS_ACCOUNT_ID }}
          broker-image: ${{ vars.GARNET_BROKER_IMAGE }}
          load-image: ${{ vars.GARNET_LOAD_IMAGE }}
          public-origin: ${{ vars.GARNET_BROKER_PUBLIC_ORIGIN }}
          notification-origins: ${{ vars.GARNET_NOTIFICATION_DELIVERY_ALLOW_ORIGINS }}
          context-hosts: ${{ vars.GARNET_CONTEXT_ALLOW_HOSTS }}
          eventual-entity-reads: ${{ vars.GARNET_EVENTUAL_ENTITY_READS }}
          database-reader-enabled: ${{ vars.GARNET_DATABASE_READER_ENABLED || 'true' }}
          aws-iot-core-mqtt-connector-enabled: ${{ vars.GARNET_AWS_IOT_CORE_MQTT_CONNECTOR_ENABLED || 'false' }}
          aurora-min-acu: ${{ vars.GARNET_AURORA_MIN_ACU || '2' }}
          aurora-max-acu: ${{ vars.GARNET_AURORA_MAX_ACU || '128' }}
          aurora-storage: ${{ vars.GARNET_AURORA_STORAGE || 'standard' }}
          worker-spot-scale-out: ${{ vars.GARNET_WORKER_SPOT_SCALE_OUT || 'true' }}
          ecs-instance-type: ${{ vars.GARNET_ECS_INSTANCE_TYPE || 'auto' }}
          deployment-strategy: ${{ vars.GARNET_DEPLOYMENT_STRATEGY }}
          schema-compatibility: ${{ vars.GARNET_SCHEMA_COMPATIBILITY }}
          bootstrap-tenant: ${{ vars.GARNET_BOOTSTRAP_TENANT || 'default' }}
          oidc-issuer: ${{ vars.GARNET_OIDC_ISSUER }}
          oidc-audiences: ${{ vars.GARNET_OIDC_AUDIENCES }}
          oidc-tenant-claim: ${{ vars.GARNET_OIDC_TENANT_CLAIM || 'garnet_tenants' }}
          bootstrap-admin-subject: ${{ vars.GARNET_BOOTSTRAP_ADMIN_SUBJECT }}
          authorization-policies: ${{ vars.GARNET_AUTHORIZATION_POLICIES || '[]' }}
          authorization-bindings: ${{ vars.GARNET_AUTHORIZATION_BINDINGS || '[]' }}
          smoke-authorization: ${{ secrets.GARNET_SMOKE_AUTHORIZATION }}
          nat-gateway-count: ${{ vars.GARNET_NAT_GATEWAY_COUNT || '2' }}
          database-deletion-protection: ${{ vars.GARNET_DATABASE_DELETION_PROTECTION || 'true' }}
          database-backup-retention-days: ${{ vars.GARNET_DATABASE_BACKUP_RETENTION_DAYS || '35' }}
          temporal-history-retention-days: ${{ vars.GARNET_TEMPORAL_HISTORY_RETENTION_DAYS || '365' }}
          temporal-history-retention-max-gib: ${{ vars.GARNET_TEMPORAL_HISTORY_RETENTION_MAX_GIB || '500' }}
          temporal-history-retention-max-partitions: ${{ vars.GARNET_TEMPORAL_HISTORY_RETENTION_MAX_PARTITIONS || '12' }}
          node-version: ${{ env.NODE_VERSION }}

  deploy-stage:
    name: Deploy stage
    needs: deploy-dev
    # These promotion switches are repository variables because environment
    # variables are unavailable while a job-level condition is evaluated.
    if: >-
      needs.deploy-dev.outputs.configured == 'true' &&
      github.ref_name == 'main' &&
      vars.GARNET_REPOSITORY_STAGE_PROMOTION_ENABLED == 'true'
    concurrency:
      group: garnet-deploy-stage
      cancel-in-progress: false
    # Approval is configured on the GitHub Environment, not here
    environment:
      name: stage
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/deploy
        with:
          aws-role-arn: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          aws-account-id: ${{ vars.AWS_ACCOUNT_ID }}
          broker-image: ${{ vars.GARNET_BROKER_IMAGE }}
          load-image: ${{ vars.GARNET_LOAD_IMAGE }}
          public-origin: ${{ vars.GARNET_BROKER_PUBLIC_ORIGIN }}
          notification-origins: ${{ vars.GARNET_NOTIFICATION_DELIVERY_ALLOW_ORIGINS }}
          context-hosts: ${{ vars.GARNET_CONTEXT_ALLOW_HOSTS }}
          eventual-entity-reads: ${{ vars.GARNET_EVENTUAL_ENTITY_READS }}
          database-reader-enabled: ${{ vars.GARNET_DATABASE_READER_ENABLED || 'true' }}
          aws-iot-core-mqtt-connector-enabled: ${{ vars.GARNET_AWS_IOT_CORE_MQTT_CONNECTOR_ENABLED || 'false' }}
          aurora-min-acu: ${{ vars.GARNET_AURORA_MIN_ACU || '2' }}
          aurora-max-acu: ${{ vars.GARNET_AURORA_MAX_ACU || '128' }}
          aurora-storage: ${{ vars.GARNET_AURORA_STORAGE || 'standard' }}
          worker-spot-scale-out: ${{ vars.GARNET_WORKER_SPOT_SCALE_OUT || 'true' }}
          ecs-instance-type: ${{ vars.GARNET_ECS_INSTANCE_TYPE || 'auto' }}
          deployment-strategy: ${{ vars.GARNET_DEPLOYMENT_STRATEGY }}
          schema-compatibility: ${{ vars.GARNET_SCHEMA_COMPATIBILITY }}
          bootstrap-tenant: ${{ vars.GARNET_BOOTSTRAP_TENANT || 'default' }}
          oidc-issuer: ${{ vars.GARNET_OIDC_ISSUER }}
          oidc-audiences: ${{ vars.GARNET_OIDC_AUDIENCES }}
          oidc-tenant-claim: ${{ vars.GARNET_OIDC_TENANT_CLAIM || 'garnet_tenants' }}
          bootstrap-admin-subject: ${{ vars.GARNET_BOOTSTRAP_ADMIN_SUBJECT }}
          authorization-policies: ${{ vars.GARNET_AUTHORIZATION_POLICIES || '[]' }}
          authorization-bindings: ${{ vars.GARNET_AUTHORIZATION_BINDINGS || '[]' }}
          smoke-authorization: ${{ secrets.GARNET_SMOKE_AUTHORIZATION }}
          nat-gateway-count: ${{ vars.GARNET_NAT_GATEWAY_COUNT || '2' }}
          database-deletion-protection: ${{ vars.GARNET_DATABASE_DELETION_PROTECTION || 'true' }}
          database-backup-retention-days: ${{ vars.GARNET_DATABASE_BACKUP_RETENTION_DAYS || '35' }}
          temporal-history-retention-days: ${{ vars.GARNET_TEMPORAL_HISTORY_RETENTION_DAYS || '365' }}
          temporal-history-retention-max-gib: ${{ vars.GARNET_TEMPORAL_HISTORY_RETENTION_MAX_GIB || '500' }}
          temporal-history-retention-max-partitions: ${{ vars.GARNET_TEMPORAL_HISTORY_RETENTION_MAX_PARTITIONS || '12' }}
          node-version: ${{ env.NODE_VERSION }}

  deploy-prod:
    name: Deploy prod
    needs: deploy-stage
    if: vars.GARNET_REPOSITORY_PROD_PROMOTION_ENABLED == 'true'
    concurrency:
      group: garnet-deploy-prod
      cancel-in-progress: false
    environment:
      name: prod
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/deploy
        with:
          aws-role-arn: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          aws-account-id: ${{ vars.AWS_ACCOUNT_ID }}
          broker-image: ${{ vars.GARNET_BROKER_IMAGE }}
          load-image: ${{ vars.GARNET_LOAD_IMAGE }}
          public-origin: ${{ vars.GARNET_BROKER_PUBLIC_ORIGIN }}
          notification-origins: ${{ vars.GARNET_NOTIFICATION_DELIVERY_ALLOW_ORIGINS }}
          context-hosts: ${{ vars.GARNET_CONTEXT_ALLOW_HOSTS }}
          eventual-entity-reads: ${{ vars.GARNET_EVENTUAL_ENTITY_READS }}
          database-reader-enabled: ${{ vars.GARNET_DATABASE_READER_ENABLED || 'true' }}
          aws-iot-core-mqtt-connector-enabled: ${{ vars.GARNET_AWS_IOT_CORE_MQTT_CONNECTOR_ENABLED || 'false' }}
          aurora-min-acu: ${{ vars.GARNET_AURORA_MIN_ACU || '2' }}
          aurora-max-acu: ${{ vars.GARNET_AURORA_MAX_ACU || '128' }}
          aurora-storage: ${{ vars.GARNET_AURORA_STORAGE || 'standard' }}
          worker-spot-scale-out: ${{ vars.GARNET_WORKER_SPOT_SCALE_OUT || 'true' }}
          ecs-instance-type: ${{ vars.GARNET_ECS_INSTANCE_TYPE || 'auto' }}
          deployment-strategy: ${{ vars.GARNET_DEPLOYMENT_STRATEGY }}
          schema-compatibility: ${{ vars.GARNET_SCHEMA_COMPATIBILITY }}
          bootstrap-tenant: ${{ vars.GARNET_BOOTSTRAP_TENANT || 'default' }}
          oidc-issuer: ${{ vars.GARNET_OIDC_ISSUER }}
          oidc-audiences: ${{ vars.GARNET_OIDC_AUDIENCES }}
          oidc-tenant-claim: ${{ vars.GARNET_OIDC_TENANT_CLAIM || 'garnet_tenants' }}
          bootstrap-admin-subject: ${{ vars.GARNET_BOOTSTRAP_ADMIN_SUBJECT }}
          authorization-policies: ${{ vars.GARNET_AUTHORIZATION_POLICIES || '[]' }}
          authorization-bindings: ${{ vars.GARNET_AUTHORIZATION_BINDINGS || '[]' }}
          smoke-authorization: ${{ secrets.GARNET_SMOKE_AUTHORIZATION }}
          nat-gateway-count: ${{ vars.GARNET_NAT_GATEWAY_COUNT || '2' }}
          database-deletion-protection: ${{ vars.GARNET_DATABASE_DELETION_PROTECTION || 'true' }}
          database-backup-retention-days: ${{ vars.GARNET_DATABASE_BACKUP_RETENTION_DAYS || '35' }}
          temporal-history-retention-days: ${{ vars.GARNET_TEMPORAL_HISTORY_RETENTION_DAYS || '365' }}
          temporal-history-retention-max-gib: ${{ vars.GARNET_TEMPORAL_HISTORY_RETENTION_MAX_GIB || '500' }}
          temporal-history-retention-max-partitions: ${{ vars.GARNET_TEMPORAL_HISTORY_RETENTION_MAX_PARTITIONS || '12' }}
          node-version: ${{ env.NODE_VERSION }}

  # Single-environment path for workflow_dispatch, so a hotfix or a re-deploy
  # does not have to walk the whole ladder.
  deploy-manual:
    name: Deploy ${{ github.event.inputs.environment }} (manual)
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    concurrency:
      group: garnet-deploy-${{ github.event.inputs.environment }}
      cancel-in-progress: false
    environment:
      name: ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/deploy
        with:
          aws-role-arn: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          aws-account-id: ${{ vars.AWS_ACCOUNT_ID }}
          broker-image: ${{ vars.GARNET_BROKER_IMAGE }}
          load-image: ${{ vars.GARNET_LOAD_IMAGE }}
          public-origin: ${{ vars.GARNET_BROKER_PUBLIC_ORIGIN }}
          notification-origins: ${{ vars.GARNET_NOTIFICATION_DELIVERY_ALLOW_ORIGINS }}
          context-hosts: ${{ vars.GARNET_CONTEXT_ALLOW_HOSTS }}
          eventual-entity-reads: ${{ vars.GARNET_EVENTUAL_ENTITY_READS }}
          database-reader-enabled: ${{ vars.GARNET_DATABASE_READER_ENABLED || 'true' }}
          aws-iot-core-mqtt-connector-enabled: ${{ vars.GARNET_AWS_IOT_CORE_MQTT_CONNECTOR_ENABLED || 'false' }}
          aurora-min-acu: ${{ vars.GARNET_AURORA_MIN_ACU || '2' }}
          aurora-max-acu: ${{ vars.GARNET_AURORA_MAX_ACU || '128' }}
          aurora-storage: ${{ vars.GARNET_AURORA_STORAGE || 'standard' }}
          worker-spot-scale-out: ${{ vars.GARNET_WORKER_SPOT_SCALE_OUT || 'true' }}
          ecs-instance-type: ${{ vars.GARNET_ECS_INSTANCE_TYPE || 'auto' }}
          deployment-strategy: ${{ vars.GARNET_DEPLOYMENT_STRATEGY }}
          schema-compatibility: ${{ vars.GARNET_SCHEMA_COMPATIBILITY }}
          bootstrap-tenant: ${{ vars.GARNET_BOOTSTRAP_TENANT || 'default' }}
          oidc-issuer: ${{ vars.GARNET_OIDC_ISSUER }}
          oidc-audiences: ${{ vars.GARNET_OIDC_AUDIENCES }}
          oidc-tenant-claim: ${{ vars.GARNET_OIDC_TENANT_CLAIM || 'garnet_tenants' }}
          bootstrap-admin-subject: ${{ vars.GARNET_BOOTSTRAP_ADMIN_SUBJECT }}
          authorization-policies: ${{ vars.GARNET_AUTHORIZATION_POLICIES || '[]' }}
          authorization-bindings: ${{ vars.GARNET_AUTHORIZATION_BINDINGS || '[]' }}
          smoke-authorization: ${{ secrets.GARNET_SMOKE_AUTHORIZATION }}
          nat-gateway-count: ${{ vars.GARNET_NAT_GATEWAY_COUNT || '2' }}
          database-deletion-protection: ${{ vars.GARNET_DATABASE_DELETION_PROTECTION || 'true' }}
          database-backup-retention-days: ${{ vars.GARNET_DATABASE_BACKUP_RETENTION_DAYS || '35' }}
          temporal-history-retention-days: ${{ vars.GARNET_TEMPORAL_HISTORY_RETENTION_DAYS || '365' }}
          temporal-history-retention-max-gib: ${{ vars.GARNET_TEMPORAL_HISTORY_RETENTION_MAX_GIB || '500' }}
          temporal-history-retention-max-partitions: ${{ vars.GARNET_TEMPORAL_HISTORY_RETENTION_MAX_PARTITIONS || '12' }}
          node-version: ${{ env.NODE_VERSION }}
