name: CD

# Continuous delivery, not deployment: a merge to main deploys to dev
# automatically, then stage and prod each wait on a GitHub Environment approval.
# The broker is stateful and shares one Aurora cluster per environment, so a
# human decides when a release moves forward.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        type: choice
        options: [dev, stage, prod]

# Serialize automatic promotion pipelines. Each deployment job also has an
# environment-specific group so manual and automatic runs cannot update the
# same stack concurrently. Never cancel an in-progress CDK deployment.
concurrency:
  group: cd-${{ github.event.inputs.environment || 'pipeline' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  # Re-verify rather than trusting that CI ran on this commit. Cheap, and it
  # closes the window where main is deployed without ever having been green.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --ci

  deploy-dev:
    name: Deploy dev
    needs: verify
    concurrency:
      group: garnet-deploy-dev
      cancel-in-progress: false
    # workflow_dispatch takes the single-environment path below instead
    if: github.event_name == 'push'
    # No approval on dev: it exists to find what unit tests cannot
    environment:
      name: dev
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required to mint the OIDC token
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/deploy
        # Repo/environment configuration, not secrets in the code
        with:
          aws-role-arn: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          aws-account-id: ${{ vars.AWS_ACCOUNT_ID }}
          broker-image: ${{ vars.GARNET_BROKER_IMAGE }}
          load-image: ${{ vars.GARNET_LOAD_IMAGE }}
          public-origin: ${{ vars.GARNET_BROKER_PUBLIC_ORIGIN }}
          notification-origins: ${{ vars.GARNET_NOTIFICATION_DELIVERY_ALLOW_ORIGINS }}
          context-hosts: ${{ vars.GARNET_CONTEXT_ALLOW_HOSTS }}
          eventual-entity-reads: ${{ vars.GARNET_EVENTUAL_ENTITY_READS }}
          deployment-strategy: ${{ vars.GARNET_DEPLOYMENT_STRATEGY }}
          schema-compatibility: ${{ vars.GARNET_SCHEMA_COMPATIBILITY }}
          bootstrap-tenant: ${{ vars.GARNET_BOOTSTRAP_TENANT || 'default' }}
          nat-gateway-count: ${{ vars.GARNET_NAT_GATEWAY_COUNT || '2' }}
          database-deletion-protection: ${{ vars.GARNET_DATABASE_DELETION_PROTECTION || 'true' }}
          database-backup-retention-days: ${{ vars.GARNET_DATABASE_BACKUP_RETENTION_DAYS || '35' }}
          temporal-history-retention-days: ${{ vars.GARNET_TEMPORAL_HISTORY_RETENTION_DAYS || '365' }}
          temporal-history-retention-max-gib: ${{ vars.GARNET_TEMPORAL_HISTORY_RETENTION_MAX_GIB || '500' }}
          temporal-history-retention-max-partitions: ${{ vars.GARNET_TEMPORAL_HISTORY_RETENTION_MAX_PARTITIONS || '12' }}
          node-version: ${{ env.NODE_VERSION }}

  deploy-stage:
    name: Deploy stage
    needs: deploy-dev
    concurrency:
      group: garnet-deploy-stage
      cancel-in-progress: false
    # Approval is configured on the GitHub Environment, not here
    environment:
      name: stage
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/deploy
        with:
          aws-role-arn: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          aws-account-id: ${{ vars.AWS_ACCOUNT_ID }}
          broker-image: ${{ vars.GARNET_BROKER_IMAGE }}
          load-image: ${{ vars.GARNET_LOAD_IMAGE }}
          public-origin: ${{ vars.GARNET_BROKER_PUBLIC_ORIGIN }}
          notification-origins: ${{ vars.GARNET_NOTIFICATION_DELIVERY_ALLOW_ORIGINS }}
          context-hosts: ${{ vars.GARNET_CONTEXT_ALLOW_HOSTS }}
          eventual-entity-reads: ${{ vars.GARNET_EVENTUAL_ENTITY_READS }}
          deployment-strategy: ${{ vars.GARNET_DEPLOYMENT_STRATEGY }}
          schema-compatibility: ${{ vars.GARNET_SCHEMA_COMPATIBILITY }}
          bootstrap-tenant: ${{ vars.GARNET_BOOTSTRAP_TENANT || 'default' }}
          nat-gateway-count: ${{ vars.GARNET_NAT_GATEWAY_COUNT || '2' }}
          database-deletion-protection: ${{ vars.GARNET_DATABASE_DELETION_PROTECTION || 'true' }}
          database-backup-retention-days: ${{ vars.GARNET_DATABASE_BACKUP_RETENTION_DAYS || '35' }}
          temporal-history-retention-days: ${{ vars.GARNET_TEMPORAL_HISTORY_RETENTION_DAYS || '365' }}
          temporal-history-retention-max-gib: ${{ vars.GARNET_TEMPORAL_HISTORY_RETENTION_MAX_GIB || '500' }}
          temporal-history-retention-max-partitions: ${{ vars.GARNET_TEMPORAL_HISTORY_RETENTION_MAX_PARTITIONS || '12' }}
          node-version: ${{ env.NODE_VERSION }}

  deploy-prod:
    name: Deploy prod
    needs: deploy-stage
    concurrency:
      group: garnet-deploy-prod
      cancel-in-progress: false
    environment:
      name: prod
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/deploy
        with:
          aws-role-arn: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          aws-account-id: ${{ vars.AWS_ACCOUNT_ID }}
          broker-image: ${{ vars.GARNET_BROKER_IMAGE }}
          load-image: ${{ vars.GARNET_LOAD_IMAGE }}
          public-origin: ${{ vars.GARNET_BROKER_PUBLIC_ORIGIN }}
          notification-origins: ${{ vars.GARNET_NOTIFICATION_DELIVERY_ALLOW_ORIGINS }}
          context-hosts: ${{ vars.GARNET_CONTEXT_ALLOW_HOSTS }}
          eventual-entity-reads: ${{ vars.GARNET_EVENTUAL_ENTITY_READS }}
          deployment-strategy: ${{ vars.GARNET_DEPLOYMENT_STRATEGY }}
          schema-compatibility: ${{ vars.GARNET_SCHEMA_COMPATIBILITY }}
          bootstrap-tenant: ${{ vars.GARNET_BOOTSTRAP_TENANT || 'default' }}
          nat-gateway-count: ${{ vars.GARNET_NAT_GATEWAY_COUNT || '2' }}
          database-deletion-protection: ${{ vars.GARNET_DATABASE_DELETION_PROTECTION || 'true' }}
          database-backup-retention-days: ${{ vars.GARNET_DATABASE_BACKUP_RETENTION_DAYS || '35' }}
          temporal-history-retention-days: ${{ vars.GARNET_TEMPORAL_HISTORY_RETENTION_DAYS || '365' }}
          temporal-history-retention-max-gib: ${{ vars.GARNET_TEMPORAL_HISTORY_RETENTION_MAX_GIB || '500' }}
          temporal-history-retention-max-partitions: ${{ vars.GARNET_TEMPORAL_HISTORY_RETENTION_MAX_PARTITIONS || '12' }}
          node-version: ${{ env.NODE_VERSION }}

  # Single-environment path for workflow_dispatch, so a hotfix or a re-deploy
  # does not have to walk the whole ladder.
  deploy-manual:
    name: Deploy ${{ github.event.inputs.environment }} (manual)
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    concurrency:
      group: garnet-deploy-${{ github.event.inputs.environment }}
      cancel-in-progress: false
    environment:
      name: ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/deploy
        with:
          aws-role-arn: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          aws-account-id: ${{ vars.AWS_ACCOUNT_ID }}
          broker-image: ${{ vars.GARNET_BROKER_IMAGE }}
          load-image: ${{ vars.GARNET_LOAD_IMAGE }}
          public-origin: ${{ vars.GARNET_BROKER_PUBLIC_ORIGIN }}
          notification-origins: ${{ vars.GARNET_NOTIFICATION_DELIVERY_ALLOW_ORIGINS }}
          context-hosts: ${{ vars.GARNET_CONTEXT_ALLOW_HOSTS }}
          eventual-entity-reads: ${{ vars.GARNET_EVENTUAL_ENTITY_READS }}
          deployment-strategy: ${{ vars.GARNET_DEPLOYMENT_STRATEGY }}
          schema-compatibility: ${{ vars.GARNET_SCHEMA_COMPATIBILITY }}
          bootstrap-tenant: ${{ vars.GARNET_BOOTSTRAP_TENANT || 'default' }}
          nat-gateway-count: ${{ vars.GARNET_NAT_GATEWAY_COUNT || '2' }}
          database-deletion-protection: ${{ vars.GARNET_DATABASE_DELETION_PROTECTION || 'true' }}
          database-backup-retention-days: ${{ vars.GARNET_DATABASE_BACKUP_RETENTION_DAYS || '35' }}
          temporal-history-retention-days: ${{ vars.GARNET_TEMPORAL_HISTORY_RETENTION_DAYS || '365' }}
          temporal-history-retention-max-gib: ${{ vars.GARNET_TEMPORAL_HISTORY_RETENTION_MAX_GIB || '500' }}
          temporal-history-retention-max-partitions: ${{ vars.GARNET_TEMPORAL_HISTORY_RETENTION_MAX_PARTITIONS || '12' }}
          node-version: ${{ env.NODE_VERSION }}
