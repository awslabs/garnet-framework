name: CI

# Runs on every pull request, and on pushes to the long-lived branches so a
# green main is a meaningful signal rather than just "the PR was green once".
on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

# A new push to the same PR makes the in-flight run obsolete
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  # Stage 1: cheapest signal first, so a formatting mistake does not burn a synth
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # install.js runs as a preinstall hook and npm installs every nested
      # package.json, including the Lambda layer. --ignore-scripts skips it so CI
      # controls installation explicitly.
      - run: npm ci --ignore-scripts
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck

  # Stage 2: unit tests. No network, no AWS credentials.
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test -- --ci

  # Stage 3: security. Split from the build so a new advisory is attributable.
  security:
    name: Security scan
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Install Lambda layer dependencies
        run: npm ci --prefix lib/layers/nodejs

      # Only these two trees reach production. Dev-only advisories in the jest or
      # eslint toolchain should not gate a deploy, so they are reported separately
      # below rather than failing the job.
      - name: Audit deployed dependencies
        run: |
          echo "::group::Root (production only)"
          npm audit --omit=dev
          echo "::endgroup::"
          echo "::group::Lambda layer (ships to Lambda)"
          npm audit --prefix lib/layers/nodejs
          echo "::endgroup::"

      - name: Audit dev dependencies (advisory only)
        continue-on-error: true
        run: npm audit

      # Catches a credential committed in the diff before it reaches main
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Stage 4: build the deployable artifact. For CDK that is the synthesized
  # cloud assembly: templates plus Lambda assets, deployable without re-synth.
  synth:
    name: Synth ${{ matrix.profile }}
    runs-on: ubuntu-latest
    needs: [test, security]
    strategy:
      fail-fast: false
      # Scorpio supports both layouts. Garnet deliberately supports only the
      # independently scalable distributed layout, so gate that complete stack
      # as a separate profile instead of merely changing the architecture enum.
      matrix:
        include:
          - profile: scorpio-concentrated
            engine: scorpio
            architecture: concentrated
            broker_image: ""
            load_image: ""
            public_origin: ""
            notification_origins: ""
            context_hosts: ""
          - profile: scorpio-distributed
            engine: scorpio
            architecture: distributed
            broker_image: ""
            load_image: ""
            public_origin: ""
            notification_origins: ""
            context_hosts: ""
          - profile: garnet-distributed
            engine: garnet
            architecture: distributed
            broker_image: public.ecr.aws/garnet/broker@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
            load_image: public.ecr.aws/garnet/load@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
            public_origin: https://broker.example
            notification_origins: https://callbacks.example
            context_hosts: uri.etsi.org,contexts.example
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix lib/layers/nodejs

      - name: Configure ${{ matrix.profile }}
        run: node .github/scripts/apply-configuration.js
        env:
          GARNET_BROKER_ENGINE: ${{ matrix.engine }}
          GARNET_BROKER_IMAGE: ${{ matrix.broker_image }}
          GARNET_LOAD_IMAGE: ${{ matrix.load_image }}
          GARNET_BROKER_PUBLIC_ORIGIN: ${{ matrix.public_origin }}
          GARNET_NOTIFICATION_DELIVERY_ALLOW_ORIGINS: ${{ matrix.notification_origins }}
          GARNET_CONTEXT_ALLOW_HOSTS: ${{ matrix.context_hosts }}
          GARNET_ARCHITECTURE: ${{ matrix.architecture }}
          GARNET_DEPLOYMENT_STRATEGY: rolling
          GARNET_REGION: us-east-1

      # No AWS credentials needed: a region is enough to resolve the template.
      - name: Synth
        run: npx cdk synth --quiet
        env:
          CDK_DEFAULT_REGION: us-east-1
          CDK_DEFAULT_ACCOUNT: '000000000000'

      # Retained so the exact assembly that passed CI is what CD deploys,
      # rather than a fresh synth that could pick up a different dependency.
      - name: Upload cloud assembly
        uses: actions/upload-artifact@v5
        with:
          name: cloud-assembly-${{ matrix.profile }}
          path: cdk.out/
          retention-days: 14

  # Single required status check, so branch protection does not need updating
  # every time a job is added or renamed.
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, security, synth]
    if: always()
    steps:
      - name: Verify all stages passed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more CI stages failed"
            exit 1
          fi
          echo "All CI stages passed"
