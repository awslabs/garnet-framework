name: CI

# Runs on every pull request, and on pushes to the long-lived branches so a
# green main is a meaningful signal rather than just "the PR was green once".
on:
  pull_request:
  push:
    branches: [main, dev, experimental]
  workflow_dispatch:

# A new push to the same PR makes the in-flight run obsolete
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  # Stage 1: cheapest signal first, so a formatting mistake does not burn a synth
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # install.js runs as a preinstall hook and npm installs every nested
      # package.json, including the Lambda layer. --ignore-scripts skips it so CI
      # controls installation explicitly.
      - run: npm ci --ignore-scripts
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck

  # Stage 2: unit tests. No network, no AWS credentials.
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test -- --ci

  # Stage 3: security. Split from the build so a new advisory is attributable.
  security:
    name: Security scan
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Install Lambda layer dependencies
        run: npm ci --prefix lib/layers/nodejs

      # Only these two trees reach production. Dev-only advisories in the jest or
      # eslint toolchain should not gate a deploy, so they are reported separately
      # below rather than failing the job.
      - name: Audit deployed dependencies
        run: |
          echo "::group::Root (production only)"
          npm audit --omit=dev
          echo "::endgroup::"
          echo "::group::Lambda layer (ships to Lambda)"
          npm audit --prefix lib/layers/nodejs
          echo "::endgroup::"

      - name: Audit dev dependencies (advisory only)
        continue-on-error: true
        run: npm audit

      # Run the open-source CLI directly over complete Git history.
      # gitleaks-action requires a separate organization license; the digest
      # keeps the scanner supply chain fixed.
      - name: Scan Git history for committed secrets
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact --verbose --no-banner --platform github .

  # Stage 4: build the deployable artifact. For CDK that is the synthesized
  # cloud assembly: templates plus Lambda assets, deployable without re-synth.
  synth:
    name: Synth ${{ matrix.profile }}
    runs-on: ubuntu-latest
    needs: [test, security]
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: garnet-rolling
            strategy: rolling
            broker_image: public.ecr.aws/garnet/broker@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
            load_image: public.ecr.aws/garnet/load@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          - profile: garnet-bluegreen
            strategy: bluegreen
            broker_image: public.ecr.aws/garnet/broker@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
            load_image: public.ecr.aws/garnet/load@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix lib/layers/nodejs

      - name: Configure ${{ matrix.profile }}
        run: node .github/scripts/configure-garnet.js
        env:
          GARNET_BROKER_IMAGE: ${{ matrix.broker_image }}
          GARNET_LOAD_IMAGE: ${{ matrix.load_image }}
          GARNET_BROKER_PUBLIC_ORIGIN: https://broker.example
          GARNET_NOTIFICATION_DELIVERY_ALLOW_ORIGINS: https://callbacks.example
          GARNET_CONTEXT_ALLOW_HOSTS: uri.etsi.org,contexts.example
          GARNET_DEPLOYMENT_STRATEGY: ${{ matrix.strategy }}
          GARNET_SCHEMA_COMPATIBILITY: unchanged
          GARNET_ECS_INSTANCE_TYPE: c9g.2xlarge
          GARNET_REGION: us-east-1

      # No AWS credentials needed: a region is enough to resolve the template.
      - name: Synth
        run: npx cdk synth --quiet
        env:
          CDK_DEFAULT_REGION: us-east-1
          CDK_DEFAULT_ACCOUNT: '000000000000'

      # Retained for template review and reproducibility. CD synthesizes a
      # separate environment-specific assembly from this locked source because
      # each environment supplies its own image, Region and security policy.
      - name: Upload cloud assembly
        uses: actions/upload-artifact@v5
        with:
          name: cloud-assembly-${{ matrix.profile }}
          path: cdk.out/
          retention-days: 14

  # Single required status check, so branch protection does not need updating
  # every time a job is added or renamed.
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, security, synth]
    if: always()
    steps:
      - name: Verify all stages passed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more CI stages failed"
            exit 1
          fi
          echo "All CI stages passed"
